 c:{'A-1':['Archive ka index card','“Vault ka code: jis din wo gayab hui, phir mahina, phir ulta ghanta.”','Index room','Vault ka code kaise banta hai, ye batata hai.'],'A-2':['Gumshuda logon ka ledger','Elena Vale: 14 November ko gayab. Entry ki syahi abhi geeli hai.','Ledger room','Din aur mahina batata hai: 14 aur 11.'],'A-3':['Aaine wala note','“Jo ghanta dohrata hai, 3:17, aaine mein 713 dikhta hai.”','Clock vault','Ulta ghanta batata hai.'],'A-4':['Phata diary page','Elena ne likha: “Archivist files rakhta hai. Hamein bhi rakhta hai. The Hollow koi jagah nahi, ek waqt hai.”','Reading room','Kahani ka raaz. Archivist wo nahi jo dikhta hai.'],'A-5':['Bell tower ki chaabi','Ek bhaari loha ki chaabi, tag par: “Bell Tower, aakhri raat ke liye.” Yahan kisi taale mein nahi lagti.','Lower stacks','Aage ke level mein kaam aayegi.']}},
4:{i:'Jungle ke andar Research Facility aisi bijli se chal rahi hai jo usme nahi honi chahiye. Board par likha hai PROJECT HOLLOW, aur har ghadi 3:17 par ruki hai.',w:'Khatra: Blackout baar-baar aate hain aur andhere mein The Hollow tez chalta hai. Teen galat code usko bula lenge.',h:'Pehle badge number, phir asli subjects ki ginti. Ek note roster se alag baat kehta hai.',sn:'Lab terminal',st:'Paanch ankon ka keypad: badge number, phir subjects ki ginti.',v:'Terminal khul jaata hai. Ek video chalta hai: Elena 3:17 par chamber mein jaati hai aur footage dohrata rehta hai. Phir ek line aati hai: HOLLOW HOUSE JAO.',

 c:{'F-1':['Research memo','“Project Hollow. Terminal code: badge number, phir subjects ki ginti. Ye memo jala dena.”','Office','Terminal code kaise banta hai.'],'F-2':['Test log','“Chamber test 3:17 par shuru hua. Khatam hone ka time: darj nahi. Andar ki ghadiyan nahi ruki; ghanta ruk gaya.”','Control room','Ghanta har jagah dohrata hai.'],'F-3':['Elena ka badge','Staff badge 0482, E. Vale, Field Analyst. Photo khurach di gayi hai.','Security','Badge number batata hai.'],'F-4':['Jungle ka naqsha','Haath se bana naqsha. Bell tower par laal gola hai, aur uske aage Hollow House.','Map room','Aakhri jagah ka ishara.'],'F-5':['Subjects ka roster','Roster: Subject 1 se 7, sab “wapas” likhe hain. Koi dastkhat nahi.','Records','Official ginti: 7.'],'F-6':['Phata note','“Subject 8 kabhi log nahi hua. Wahi bahar aaya tha.”','Antechamber','Asli ginti 8 ho sakti hai.']}},
5:{i:'Hollow House kisi naqshe mein kabhi nahi tha. Darwaza khula hai, barish ruk gayi hai, aur andar kahin ek jaani-pehchani awaaz gungunati hai.',w:'Aakhri level: blackout, sabse tez Hollow, aur sirf do galat code. Syahi par bharosa karo, kaagaz par nahi.',h:'Ghanta, phir kamra. Ek parchi jaali hai. Hotel ka register yaad karo.',sn:'Hollow darwaza',st:'Chaukhat ke andar chhe ankon ka dial: ghanta, phir kamra.',v:'Darwaza andar ki taraf khulta hai. Aage roshni ki lambi seedhi hai, aur Elena ki awaaz: “Wapas aane ke liye shukriya.”',
 np:['Elena','Ek aurat deewar ki taraf muh karke khadi hai. Jab wo mudti hai, uski aankhein tumhari behen jaisi hain. “Adrian. Tum aa gaye. Tum late ho, aur jaldi bhi. Dono sach hain yahan.”','“Ghar par bharosa mat karo. Mujh par bhi nahi, jab tak mera chhoda hua na dikha do.”','Wo muskurati hai, aur ek pal ke liye barish ruk jaati hai. “Hollow kaagaz badalta hai, syahi nahi. Darwaza ghante aur sachche kamre ko jaanta hai. Jao, phir se 3:17 hone se pehle.”'],
 c:{'H-1':['Darwaze par likhawat','Chaukhat ke upar khuda hai: “Ghanta, phir wo kamra jahan gayab hone wali ne shuru kiya.”','Foyer','Darwaze ka code kaise banta hai.'],'H-2':['Purani kamre ki chaabi','Peetal ka tag: “Room 6.” Blackwater Hotel mein Elena ka kamra.','Parlor','Ek kamra batata hai.'],'H-3':['Ruki hui jeb-ghadi','Ghadi 3:17 par ruki hai. Kaanch thanda hai, aur dial geela hai.','Library','Ghanta pakka karta hai.'],'H-4':['Hotel ki parchi','Parchi par “Room 9” likha hai. Likhawat lagbhag Elena jaisi hai. Lagbhag.','Study','Shak wali. Chaabi se mel nahi khaati.'],'H-5':['Bachche ki drawing','Ek lamba bina chehre ka saaya. Neeche: “Wo tabhi chalta hai jab koi nahi dekhta.”','Nursery','Hollow ka vyavhaar samjhata hai.'],'H-6':['Elena ka aakhri note','“Room 9 wali parchi jaali hai. Register par bharosa karo, parchi par nahi. Maine wahi kamra likha jahan se shuru hui.”','Cellar','Room 6 pakka karta hai, Room 9 nahi.']}}};
for(const n in TX){const x=TX[n],d=LV[n];d.intro=x.i;d.warn=x.w;d.hint=x.h;d.win=x.v;d.safe.n=x.sn;d.safe.t=x.st;Object.assign(d.npc,{n:x.np[0],i:x.np[1],lie:x.np[2],sec:x.np[3]});d.clues.forEach(c=>{const y=x.c[c[0]];c[3]=y[0];c[5]=y[1];c[6]=y[2];c[7]=y[3];});}
LV[2].name='Greywick Thana';LV[3].name='Zameen ke neeche ka Archive';LV[4].name='Jungle ki Research Facility';LV[1].safe.n='Deewar ki tijori';
Object.assign(CL,{'C-001':['Mehmaan register','Gyarah saal purana ek panna: “E. Vale, Room 6, 3:17 baje check-in.” Syahi abhi bhi geeli hai.','Lobby ka desk','Elena ko yahan 3:17 par rakhta hai.'],'C-002':['Ruki hui ghadi','Office ki ghadi 3:17 par ruki hai. Battery nahi hai, phir bhi second ki sui hilti hai.','Peeche ka office','Wo ghanta jo dohrata hai. Shayad ek code.'],'C-003':['Phati hui photo','Elena chaar hotel staff ke saath. Peeche likha hai: “Sab ek hi ghante par ruk gaye. Orla se poocho.”','Storeroom','Elena ko staff se aur Orla se jodti hai.']});
NL[1]['C-001'].name='Mehmaan register';NL[1]['C-002'].name='Ruki hui ghadi';NL[1]['C-003'].name='Phati hui photo';NL[1].safe.name='Deewar ki tijori';
QN.length=0;QN.push('Kam','Madhyam','Zyada');SN.length=0;SN.push('Kam','Normal','Zyada');
WH.length=0;WH.push('Elena ki bahut dheemi awaaz: “Nazar mat hatana.”','Deewarein saans andar leti hain. Phir baahar.','Kahin bachche ke hansne ki awaaz aati hai, par wo dikhta nahi.','Tumhare apne kadmon ki goonj peechhe se aati hai, ek pal der se.','Paas ki lakdi par 3:17 khuda hai. Pehle wo wahan nahi tha.','Peechhe ek ghadi ek baar tik karti hai.');
LORE.length=0;LORE.push('Elena gyarah saal pehle 3:17 par check-in hui aur kabhi nikli nahi. Tab se hotel wahi raat dohra raha hai.','Deputy Moss Cell 4 mein hai, bina budhe. Sergeant Rook ne use us ghante mein band kiya. Police ko loop ka pata tha aur unhone chup rehna chuna.','Archivist logon ko files ki tarah darj karta hai. Elena 14 November ko darj hui. Files khud ko badal leti hain, aur The Hollow un khaali jagahon par palta hai.','Project Hollow ne waqt mein ek darwaza khola. Subject 8 galat ban kar nikla: wahi The Hollow hai. Wo tabhi chalta hai jab koi nahi dekhta, aur uske paas Elena ka badge hai.','Elena darwaza band rakhne ke liye loop mein ruki. Jo ghante mein khada hota hai wo Hollow ko Greywick ke andar rakhta hai. Ghar ek badli chahta hai.');
for(const [s,t] of [['#bJ','Diary'],['#bP','Ruko'],['#bI','Interact karo'],['#bF','Torch']]){const e=document.querySelector(s);if(e)e.textContent=t;}
function save(q){try{localStorage.setItem('hollowhour3d',JSON.stringify(S));if(!q)toast('Game save ho gaya.');return true;}catch(e){if(!q)toast('Yahan save nahi ho sakta.');return false;}}
function objective(){const d=LV[S.level],n=d.ids.filter(i=>S.clues[i]).length,t=d.ids.length;$('obj').innerHTML='<b>Level '+S.level+' · '+d.name+'</b><br>'+(S.flags[d.sk]?'Level poora. Agle level ke liye Journal kholo.':n>=t?d.safe.n+' kholo.':'Saboot '+n+'/'+t+'. '+d.npc.n+' se baat karo.')+(d.drain?'<br>Battery '+Math.round(S.bat)+'%':'');}
function hint(){if(S.level>1)return LV[S.level].hint;const n=Object.keys(S.clues).length;return S.flags.safeOpen?'Level ek poora ho gaya.':n<3?'Chamakti cheezein dhundho: lobby ka desk, peeche ka office aur storeroom.':'Ghadi aur register ka ek hi time hai. Usko chaar ankon mein try karo.';}
function collect(id){if(S.clues[id])return;S.clues[id]=1;NODES[id].g.visible=false;if(id!=='C-002')NODES[id].o.visible=false;snd('clue');save(true);objective();if(S.level===1&&Object.keys(S.clues).length===2)setTimeout(scare,1800);panel(CL[id][0]+' <small style="color:#8b95a3">'+id+'</small>','<p>'+CL[id][1]+'</p><p class="un"><small>Journal mein jod diya gaya.</small></p>',[btn('Aage badho',close)]);}
function journal(){const have=Object.keys(S.clues);let h='<p style="color:#8b95a3;font-size:14px">Detective Adrian Vale · Greywick case file</p>';
 if(!have.length)h+='<p>Abhi koi saboot nahi.</p>';
 for(const id of have)h+='<div class="cl"><b>'+id+' · '+CL[id][0]+'</b><br>'+CL[id][1]+'<small>Mila: '+CL[id][2]+' · '+CL[id][3]+' · <span class="ok">Jama</span></small></div>';
 h+='<h2 style="margin-top:14px;font-size:16px">Saboot ka board</h2>';const t1=S.clues['C-001']&&S.clues['C-002'];
 h+='<div class="cl"><b>Elena 3:17 par check-in hui</b><small>C-001 + C-002 chahiye · <span class="'+(t1?'ok':'un')+'">'+(t1?'Pakka':'Abhi pakka nahi')+'</span></small></div>';
 const t2=S.clues['C-003']&&S.flags.orlaDenied;h+='<div class="cl"><b>Orla kuch chhupa rahi hai</b><small>C-003 + ek contradiction chahiye · <span class="'+(t2?'ok':'un')+'">'+(t2?'Pakka':'Abhi pakka nahi')+'</span></small></div>';
 if(S.flags.orlaDenied)h+='<div class="cl"><b class="bad">Contradiction</b><br>Orla ne kaha Elena yahan nahi thi, par register kuch aur kehta hai.</div>';
 h+='<h2 style="margin-top:14px;font-size:16px">Saman</h2><p>'+(have.length?have.map(i=>CL[i][0]).join(', '):'Khaali')+(S.flags.safeOpen?', Elena ka recorder':'')+'</p><div class="cl"><b>Ishara</b><br>'+hint()+'</div>';
 panel('Jaanch ka Journal',h+loreHtml(),(S.flags[LV[S.level].sk]&&S.level<5?[btn('Agla level',nextLevel,'ac'),btn('Band karo',close)]:[btn('Band karo',close)]));}
function talk(){const reg=!!S.clues['C-001'],ph=!!S.clues['C-003'];
 const say=(who,txt)=>{const bs=[];
  bs.push(btn('“Kya aapne Elena Vale ko dekha hai?”',()=>{if(S.flags.orlaCracked)say('Orla','“Wo ghante par aayi thi. Us ghante se kabhi nikli nahi.”');else{S.flags.orlaDenied=1;say('Orla',reg?'“Is naam ka koi yahan nahi ruka, detective.” Uska haath counter par kaanp raha hai.':'“Vale? Nahi. Hamara register saaf hai. Aap kyun poochh rahe hain?”');}}));
  bs.push(btn('“3:17 par kya hota hai?”',()=>say('Orla','Wo khidki ki taraf dekhti hai. “3:17 par kuch nahi hota, detective. Wahi to darr hai. Phir kuch kabhi nahi hilta. Sirf mehmaan.”')));
  bs.push(btn('“Ye hotel ruka hua kyun lagta hai?”',()=>say('Orla','“Greywick ki barish aisi hi hai. Log ghadiyan dekhna bhool jaate hain.”')));
  if(reg)bs.push(btn('Usko guest register dikhao (C-001)',()=>{S.flags.orlaCracked=1;save(true);say('Orla','Uska chehra safed pad jaata hai. “Wo panna jala diya gaya tha. …Us raat office ki ghadi ruk gayi. Peeche ki tijori ghante par khulti hai. Ab ek shabd nahi.”');},'ac'));
  if(ph)bs.push(btn('Usko phati hui photo dikhao (C-003)',()=>say('Orla','“Wo chaaron ab nahi hain. Bas main bachi hoon. Please, usko mujhse pehle dhundh lo.”')));
  bs.push(btn('Chalo',close));panel(who,'<p>'+txt+'</p>',bs);};
 say('Mrs. Orla Finch','Clerk apne ledger se upar dekhti hai. “Raat ke liye kamra chahiye, ya kisi ko dhundh rahe ho?”');}
function safe(){if(S.level>1)return safeL();if(S.flags.safeOpen){toast('Tijori ab khaali hai.');return;}
 panel('Deewar ki tijori','<p>Chaar ankon ka dial. Neeche khuda hai: “Sirf wo ghanta jo dohrata hai.”</p><input id="code" inputmode="numeric" maxlength="4" placeholder="----"><p id="fb" class="bad" style="min-height:20px"></p>',
 [btn('Code try karo',()=>{const v=$('code').value;if(v==='0317'){S.flags.safeOpen=1;save(true);snd('open');objective();panel('Tijori khul gayi','<p>Andar ek chhota cassette recorder hai. Tum play dabate ho. Static, phir ek awaaz jo gyarah saal se nahi suni:</p><p><i>“Adrian, agar tum sun rahe ho, to ghante par bharosa mat karna…”</i></p><p class="ok">Level 1 poora. Level 2 intezaar kar raha hai.</p>',[btn('Agla level',nextLevel,'ac'),btn('Yahin raho',close)]);}else{snd('bad');$('fb').textContent=v.length<4?'Chaar ank daalo.':'Galat code. Kuch nahi hua.';}},'ac'),btn('Peechhe hato',close)]);}
function safeL(){const d=LV[S.level],n=S.level,L=d.code.length;if(S.flags[d.sk]){toast('Pehle hi khul chuka hai.');return;}
 panel(d.safe.n,'<p>'+d.safe.t+'</p><input id="code" inputmode="numeric" maxlength="'+L+'" placeholder="'+'-'.repeat(L)+'"><p id="fb" class="bad" style="min-height:20px"></p>',[btn('Code try karo',()=>{const v=$('code').value;
  if(v===d.code){S.flags[d.sk]=1;save(true);snd('open');objective();panel('Khul gaya','<p>'+d.win+'</p>',[n<5?btn('Agla level',nextLevel,'ac'):btn('Khatam',ending,'ac'),btn('Yahin raho',close)]);return;}
  snd('bad');if(v.length<L){$('fb').textContent=L+' ank daalo.';return;}
  S.wrong=(S.wrong||0)+1;$('fb').textContent='Galat code.'+(d.tries?' ('+Math.max(0,d.tries-S.wrong)+' mauke bache)':'');
  if(d.tries&&S.wrong>=d.tries){S.wrong=0;close();toast('Dial cheekh uthta hai. The Hollow paas hai…');watcher.position.set(S.px+Math.sin(S.yaw)*4,0,S.pz+Math.cos(S.yaw)*4);}},'ac'),btn('Peechhe hato',close)]);}
function talkL(){const n=LV[S.level].npc,fk='sec'+S.level;const say=t=>{const bs=[btn('“Kya aapne Elena Vale ko dekha hai?”',()=>say(S.flags[fk]?'“Wo ab bhi yahin hai. Us ghante mein.”':n.lie)),btn('“Ye jagah kya chhupa rahi hai?”',()=>say('“Kuch bhi jo milna nahi chahta.”'))];if(S.clues[n.need])bs.push(btn(CL[n.need][0]+' dikhao ('+n.need+')',()=>{S.flags[fk]=1;save(true);say(n.sec);},'ac'));bs.push(btn('Chalo',close));panel(n.n,'<p>'+t+'</p>',bs);};say(n.i);}
function nextLevel(){close();S.flash=true;S.wrong=0;enterLevel(S.level+1,false);save(true);const d=LV[S.level];panel('Level '+S.level+' · '+d.name,'<p>'+d.intro+'</p><p class="bad"><small>'+d.warn+'</small></p>',[btn('Shuru karo',close,'ac')]);}
function ending(){panel('The Hollow Hour','<p>Elena ki awaaz static mein kho jaati hai. Tumhara phone buzz karta hai: ek naya voicemail, gyarah saal pehle ka, tumhare hi number se. Tumhari hi awaaz mein: “Adrian, Greywick mat aana.” Kahin upar ghanta bajta hai, aur har ghadi 3:17 par ruk jaati hai.</p><p class="ok">The Hollow House khamosh ho jaata hai. Abhi ke liye. Khelne ke liye shukriya. Aur chapters aa rahe hain.</p>',[btn('Main menu',toMenu,'ac')]);}
function caught(){S.deaths=(S.deaths||0)+1;snd('bad');lt=1;toast('The Hollow ne tumhe pakad liya. Tum entrance par jaagte ho…');const d=LV[S.level];S.px=d.start[0];S.pz=d.start[1];S.yaw=d.start[2];wkReset();}
function takeBat(id){S.flags['g'+id]=1;NODES[id].o.visible=false;NODES[id].g.visible=false;S.bat=Math.min(100,S.bat+45);snd('click');toast('Extra battery: +45%');save(true);objective();}
function scare(){if(S.level!==1||wk.on)return;watcher.visible=true;watcher.position.set(S.px-Math.sin(S.yaw)*5,0,S.pz-Math.cos(S.yaw)*5);toast('Wahan kuch khada tha.');snd('thunder');setTimeout(()=>{if(!wk.on)watcher.visible=false;},1400);}
function settings(){panel('Settings','',[btn('Graphics: '+QN[S.q],()=>{setQ((S.q+1)%3);save(true);settings();}),btn('Dekhne ki speed: '+SN[S.sens<.9?0:S.sens>1.1?2:1],()=>{S.sens=S.sens<.9?1:S.sens>1.1?.6:1.5;save(true);settings();}),btn('Awaaz: '+(muted?'Band':'Chalu'),()=>{muted=!muted;if(MG)MG.gain.value=muted?0:1;settings();}),btn('Wapas',pause,'ac')]);}
function pause(){if(!running)return;if(ovOpen&&!paused)return;paused=true;panel('Ruka hua','',[btn('Jaari rakho',()=>{close();paused=false;},'ac'),btn('Journal',()=>{paused=false;journal();}),btn('Settings',settings),btn('Game save karo',()=>save()),btn('Save kiya hua load karo',()=>{if(load()){setQ(S.q);enterLevel(S.level||1,true);toast('Game load ho gaya.');close();paused=false;}else toast('Koi save nahi mila.');}),btn('Main menu',toMenu)]);}
function start(cont){if(cont){if(!load())return;}else Object.assign(S,{px:3,pz:9,yaw:-Math.PI/2,pitch:0,clues:{},flags:{},flash:true,level:1,bat:100,deaths:0,wrong:0});
 for(const q of [2,3,4,5])LV[q].clues.forEach(c=>{CL[c[0]]=[c[3],c[5],c[6],c[7]];});enterLevel(S.level||1,cont);
 setQ(S.q);$('menu').style.display='none';$('hud').style.display='block';audioInit();running=true;paused=false;objective();
 if(!cont)panel('Voicemail · 3:17 a.m.','<p style="color:#8b95a3;font-size:14px">Gyarah saal pehle aaya. Aaj raat suna gaya.</p><p><i>“Adrian… main hoon. Agar tumhe ye mile, main Greywick mein hoon. Blackwater Hotel. Ghanta dohrata rehta hai, aur main ise rok nahi paa rahi…”</i></p><p>Tum barish mein gaadi chalate ho. Lobby khaali hai, ghadi galat hai, aur register khula hai. Usmein har mehmaan ne 3:17 par dastkhat kiye hain. Tumhare peeche darwaza apne aap band ho jaata hai.</p>',[btn('Andar jao',close,'ac')]);else toast('Wapas swagat hai, Detective.');}
size();setQ(S.q);requestAnimationFrame(frame);
