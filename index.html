 return {name:th[0],map:mp,ids,hb:.2,fog:.12+n*.003,spd:Math.min(2.6,1.9+.1*n),drain:Math.min(1.5,.9+.05*n),tries:2,bo:1,sk:'safe'+n,code:th[6],start:[3,9,-Math.PI/2],wp:[W*2-4,23],lamps:[[3.5,4.5],[(W*.35|0)+.5,10.5],[(W*.65|0)+.5,4.5],[W-3.5,10.5]],wins:[[9,2.03,0],[W*2-9,2.03,0]],bat:[[W*.6,9],[W*1.4,21],[W*.9,21]],intro:th[1],warn:'Danger: blackouts, a fast Hollow, and only two wrong codes.',hint:th[2],safe:{n:th[4],p:[(sc+.5)*C,25.3],ry:-Math.PI/2,t:th[5]},win:th[3],npc:{n:th[7][0],p:[((W/3|0)+.5)*C,21],c:[0x2a2a3a,0x3a3a50,0xd0b8a0],i:th[7][1],lie:th[7][2],need:ids[th[9]||0],sec:th[7][3]},clues};}
const TH={
6:['Ghanta Ghar','Greywick ka Ghanta Ghar. Ghanta har raat bajta hai, par seedhiyon par dhool jami hai. Ooper se kisi ke saans lene ki awaaz aati hai.','Ghante ki ginti, phir manzil. Dono do-do ank.','Ghanta ghar ke upar ek darwaza khulta hai. Neeche shehar andhere mein hai, par ghadiyan abhi bhi 3:17 dikhati hain. Elena: “Aur neeche jao. Aspatal.”','Ghanta ghar ka taala','Chaar ankon ka dial: ghante ki ginti, phir manzil.','1703',['Ghantewala','Ek budha aadmi rassi pakde khada hai. “Main gyarah saal se ghanta baja raha hoon. Koi sunta nahi.”','“Elena? Wo ooper gayi thi. Neeche nahi aayi.”','Uski aankhein bhar aati hain. “Usne kaha tha ghanta ginte rehna. Satrah baar. Hamesha satrah.”'],[['Ghante ki rassi','Rassi par 17 gaanth hain. Har gaanth ek raat ka ghanta hai.','Neeche ka hall','Ghante ki ginti: 17.'],['Seedhiyon ka naqsha','Tower mein teen manzilein hain. Chauthi par koi seedhi nahi jaati.','Pehli manzil','Manzilein: 03.'],['Ghantewale ki chit','“Taale ka rule: pehle ghante ki ginti, phir manzil. Dono do ank.”','Doosri manzil','Code ka tareeka batata hai.'],['Toota hua ghanta','Ghante par khuda hai: “Aakhri ghanta kabhi nahi bajta.”','Top floor','Kahani ka hissa. Code nahi.']],1],
7:['Greywick Aspatal','Greywick Aspatal. Stretcher khud-ba-khud chalte hain, aur har kamre ki ghadi 3:17 par ruki hai. Koi mareez nahi hai, par bistar abhi bhi garam hain.','Ward, bistar, phir ghanta. Teeno milao.','Operation theatre ka darwaza khulta hai. Andar ek hi bistar hai, uspar Elena ka naam. Neeche likha hai: “Wo yahan se chali gayi. Station.”','Records ki almari','Chhe ankon ka dial: ward, bistar, phir ghanta.','412317',['Nurse Kamla','Ek nurse register mein likhti rehti hai, bina pen ke. “Visiting hours gyarah saal pehle khatam hue.”','“Elena Vale? Hamare yahan koi bharti nahi hua.”','Wo haath rok leti hai. “Usne bistar ginna shuru kiya tha. Bahut der tak ginti rahi.”'],[['Bharti form','Elena Vale ko Ward 4 mein bharti kiya gaya.','Reception','Ward number: 4.'],['Bistar ka tag','Bistar number 12. Chadar par kisi ne 3:17 khoda hai.','Ward 4','Bistar number: 12.'],['Doctor ka note','“Almari ka code: ward, bistar, phir wo ghanta jo dohrata hai.”','Doctor ka kamra','Code ka tareeka batata hai.'],['Phata chart','Chart par likha hai: “Mareez: ek aur. Jise koi nahi dekhta.”','Operation theatre','Kahani ka raaz. Code nahi.']],1],
8:['Railway Station','Greywick Railway Station. Platform par ek train khadi hai jiske darwaze khule hain, par andar koi nahi. Ghadi 3:17 par ruki hai, aur seeti dheemi awaaz mein bajti hai.','Ticket ka number ulta padho.','Station master ka kamra khulta hai. Train ka engine chalu ho jaata hai. Elena: “Ab sheeshon ke mahal mein aao.”','Station master ki tijori','Chaar ankon ka dial: ticket number ulta.','1428',['Station Master','Wardi mein ek aadmi platform ki taraf dekhta hai. “Train aati hai, par kabhi pahunchti nahi.”','“Elena? Wo to chadh gayi thi. Utri nahi.”','Wo seeti ko haath mein ghumata hai. “Uska ticket mere paas hai. Number ulta karke padhna, tab kholta hai.”'],[['Elena ka ticket','Ticket number 8241. Tareekh: aaj.','Platform','Ticket number: 8241.'],['Station master ka note','“Tijori ka code: ticket number ulta.”','Station master ka kamra','Code ka tareeka batata hai.'],['Time table','Sab trains 3:17 par chalti hain. Koi 3:18 par nahi.','Waiting room','Ghanta phir dohrata hai. Code nahi.'],['Khali dabba','Dabbe mein ek ghadi hai jo ulti chal rahi hai.','Train ka dabba','Ulta padhne ka ishara.']],0],
9:['Aaina Mahal','Aaina Mahal. Har deewar sheesha hai, aur har sheeshe mein tum thodi der pehle ke apne aap ko dekhte ho. Ek parchhai sheeshe ke andar tumhari taraf chal rahi hai.','Pehle behen ki umar, phir bhai ki umar.','Sheeshe ka darwaza chhan se tootta hai. Peechhe ek seedhi neeche jaati hai. Elena: “Ghar wapas aao. Ghante se pehle.”','Sheeshe ka taala','Chaar ankon ka dial: behen ki umar, phir bhai ki umar.','2931',['Parchhai','Sheeshe se ek parchhai tumhari shakal mein bol rahi hai. “Tum late ho. Hamesha late.”','“Elena? Wo mere andar hai. Tumhare andar bhi.”','Wo muskurati hai, tumhari muskurahat mein. “Umar likhi hai. Behen pehle, bhai baad mein.”'],[['Elena ka license','Elena Vale, umar 29. Photo mein wo muskura rahi hai.','Pehla sheesha','Behen ki umar: 29.'],['Tumhara license','Adrian Vale, umar 31. Photo mein tumhari aankhein khaali hain.','Doosra sheesha','Bhai ki umar: 31.'],['Sheeshe par likhawat','Dhundh par ungli se likha hai: “Taala: behen pehle, phir bhai.”','Beech ka hall','Code ka tareeka batata hai.'],['Toota hua sheesha','Tootne ke baad bhi wo jud jaata hai. Har tukde mein tum nahi ho.','Aakhri hall','Kahani ka raaz. Code nahi.']],0],
10:['The Hollow Hour','Aakhri ghanta. Greywick ka har kamra ek hi kamre mein simat gaya hai: ek khaali hotel ki lobby, 3:17 par ruki ghadi. Ek aur Adrian register par dastkhat karta hai.','Wo ghanta (lobby wala), phir Elena ki umar. Jo tumne pehle dekha, yaad karo.','Ghadi ek baar tik karti hai. 3:18. Phone mein ek voicemail aata hai: tumhari awaaz: “Ab tum yahan rukoge, taaki wo jaa sake.”','Aakhri ghadi','Chhe ankon ka dial: wo ghanta, phir Elena ki umar.','031729',['Elena','Elena register ke peechhe khadi hai, kamzor, muskurati hui. “Adrian. Aakhri baar. Ghanta tum par rukega, ya mujh par.”','“Kuch mat poocho. Bas ghadi ko dekho.”','Uski aankhon mein aansoo hain. “Wahi ghanta jo hamesha dohrata hai. Phir meri umar. Main gayi to ghar khul jayega.”'],[['Lobby ki ghadi','Ghadi 3:17 par ruki hai. Dial par tumhari ungliyon ke nishaan hain.','Lobby','Wo ghanta: 3:17.'],['Elena ka passport','Elena Vale, umar 29. Aakhri stamp: Greywick, 3:17.','Desk','Elena ki umar: 29.'],['Tumhara dastkhat','Register mein tumhara dastkhat, abhi ka. Syahi sookhi nahi.','Register','Tum bhi loop ka hissa ho.'],['Aakhri note','“Ghanta, phir meri umar. Phir darwaza khulega, aur main nahi.”','Basement','Code ka tareeka batata hai.']],3]};
